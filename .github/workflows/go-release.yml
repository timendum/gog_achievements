name: Release

on:
  release:
    types: [created]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build
        run: |
          GOOS=windows GOARCH=amd64 go build -o gog-achievements.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gog-achievements.exe
