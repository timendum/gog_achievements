# This workflow will build a golang project

name: Go

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows]
        goarch: [amd64]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
    - name: Build on ${{matrix.GOARCH}} for ${{matrix.GOOS}}
      run: GOOS=${{matrix.GOOS}} GOARCH=${{matrix.GOARCH}} go build
    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: gog-achievements-${{ matrix.GOARCH }}-${{ matrix.GOOS }}
        path: |
          gog-achievements.exe
